global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'

  - job_name: 'register-service'
    static_configs:
      - targets: ['register-service:3002']
    metrics_path: '/metrics'

  - job_name: 'target-service'
    static_configs:
      - targets: ['target-service:3003']
    metrics_path: '/metrics'

  - job_name: 'score-service'
    static_configs:
      - targets: ['score-service:3004']
    metrics_path: '/metrics'

  - job_name: 'mail-service'
    static_configs:
      - targets: ['mail-service:3005']
    metrics_path: '/metrics'

  - job_name: 'clock-service'
    static_configs:
      - targets: ['clock-service:3006']
    metrics_path: '/metrics'

  - job_name: 'read-service'
    static_configs:
      - targets: ['read-service:3007']
    metrics_path: '/metrics'
