global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Lokale ontwikkeling: services draaien op de host machine.
# host.docker.internal laat de Prometheus container de host machine bereiken.
# Op Linux: vervang host.docker.internal door 172.17.0.1

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: '/metrics'

  - job_name: 'register-service'
    static_configs:
      - targets: ['host.docker.internal:3002']
    metrics_path: '/metrics'

  - job_name: 'target-service'
    static_configs:
      - targets: ['host.docker.internal:3003']
    metrics_path: '/metrics'

  - job_name: 'score-service'
    static_configs:
      - targets: ['host.docker.internal:3004']
    metrics_path: '/metrics'

  - job_name: 'mail-service'
    static_configs:
      - targets: ['host.docker.internal:3005']
    metrics_path: '/metrics'

  - job_name: 'clock-service'
    static_configs:
      - targets: ['host.docker.internal:3006']
    metrics_path: '/metrics'

  - job_name: 'read-service'
    static_configs:
      - targets: ['host.docker.internal:3007']
    metrics_path: '/metrics'
