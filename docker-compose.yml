version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: photoprestiges_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - photoprestiges_network

  auth-service:
    build: ./services/auth
    container_name: auth_service
    env_file:
      - .env
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:3001"
    depends_on:
      - mongo
    networks:
      - photoprestiges_network

  register-service:
    build: ./services/register
    container_name: register_service
    env_file:
      - .env
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
    ports:
      - "${REGISTER_SERVICE_PORT:-3002}:3002"
    depends_on:
      - mongo
    networks:
      - photoprestiges_network

volumes:
  mongo_data:

networks:
  photoprestiges_network:
    driver: bridge
