version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: photoprestiges_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - photoprestiges_network

  auth-service:
    build: ./services/auth
    container_name: auth_service
    env_file:
      - .env
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:3001"
    depends_on:
      - mongo
    networks:
      - photoprestiges_network

  register-service:
    build: ./services/register
    container_name: register_service
    env_file:
      - .env
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
      MAIL_SERVICE_URL: http://mail-service:3005
    ports:
      - "${REGISTER_SERVICE_PORT:-3002}:3002"
    depends_on:
      - mongo
    networks:
      - photoprestiges_network

  target-service:
    build: ./services/target
    container_name: target_service
    env_file:
      - .env
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
      UPLOAD_DIR: /uploads
      BASE_URL: http://localhost:3003
    ports:
      - "${TARGET_SERVICE_PORT:-3003}:3003"
    volumes:
      - target_uploads:/uploads
    depends_on:
      - mongo
    networks:
      - photoprestiges_network

  score-service:
    build: ./services/score
    container_name: score_service
    env_file:
      - .env
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
      MAIL_SERVICE_URL: http://mail-service:3005
    ports:
      - "${SCORE_SERVICE_PORT:-3004}:3004"
    depends_on:
      - mongo
    networks:
      - photoprestiges_network

  mail-service:
    build: ./services/mail
    container_name: mail_service
    env_file:
      - .env
    environment:
      PORT: 3005
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
    # No host port mapping — mail-service is internal-only.
    # Other services reach it via http://mail-service:3005 on the Docker network.
    # Expose the port only for local development by setting MAIL_SERVICE_PORT in .env
    # and uncommenting the line below:
    # ports:
    #   - "${MAIL_SERVICE_PORT:-3005}:3005"
    depends_on:
      - mongo
    networks:
      - photoprestiges_network

  clock-service:
    build: ./services/clock
    container_name: clock_service
    env_file:
      - .env
    environment:
      PORT: 3006
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
      MAIL_SERVICE_URL: http://mail-service:3005
    ports:
      - "${CLOCK_SERVICE_PORT:-3006}:3006"
    depends_on:
      - mongo
      - mail-service
    networks:
      - photoprestiges_network

  read-service:
    build: ./services/read
    container_name: read_service
    env_file:
      - .env
    environment:
      PORT: 3007
      MONGODB_URI: mongodb://mongo:27017/photoprestiges
    ports:
      - "${READ_SERVICE_PORT:-3007}:3007"
    depends_on:
      - mongo
    networks:
      - photoprestiges_network

volumes:
  mongo_data:
  target_uploads:

networks:
  photoprestiges_network:
    driver: bridge
